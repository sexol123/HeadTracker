[project]
name = "headtracker"
version = "0.1.0"
description = "Universal head tracking software using webcam"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "pynput>=1.7.0",
    "websocket-client>=1.0.0",
]

[project.scripts]
headtracker = "main:main"
